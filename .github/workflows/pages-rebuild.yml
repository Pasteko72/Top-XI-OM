name: Rebuild GitHub Pages

# Pages deploys from this branch; ask GitHub to rebuild it on every push.
on:
  push:
    branches: [claude/marseille-player-voting-app-uj8pbf]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
